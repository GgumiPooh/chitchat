# INFO: Local development database only. Production is Neon (REQUIREMENTS.md § 0.).

services:
  postgres:
    image: postgres:17-alpine
    container_name: jandh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jandh
      POSTGRES_PASSWORD: jandh
      POSTGRES_DB: jandh
      # INFO: Korean collation parity with Neon; the DB itself stores timestamps in UTC (REQUIREMENTS.md § 11.3.).
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jandh -d jandh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
