services:
  app:
    image: ghcr.io/ggumipooh/jandh:latest
    container_name: jandh-app
    restart: always
    env_file:
      - .env
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  web:
    external: true
