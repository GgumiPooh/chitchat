services:
  caddy:
    image: caddy:2-alpine
    container_name: jandh-caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/www:/srv/www:ro
      - /srv/caddy/sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    image: ghcr.io/ggumipooh/jandh:latest
    container_name: jandh-app
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  caddy-data:
    name: jandh-caddy-data
  caddy-config:
    name: jandh-caddy-config

networks:
  default:
    name: jandh-net
