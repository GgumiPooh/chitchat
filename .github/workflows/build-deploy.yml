name: Build and deploy

on:
  push:
    branches:
      - main
    # WARN: REQUIREMENTS.md § 12.4. GitHub disables a public repository's schedules after 60
    # days with no activity, so an external cron overwrites `.github/keepalive` to keep them
    # alive. Without this filter each of those commits rebuilds and redeploys production.
    paths-ignore:
      - .github/keepalive
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ggumipooh/jandh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_EMOTICONS_ORIGIN=${{ vars.NEXT_PUBLIC_EMOTICONS_ORIGIN }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SSE_IDLE_SLEEP=${{ vars.NEXT_PUBLIC_SSE_IDLE_SLEEP }}
            NEXT_PUBLIC_EMOTICON_API_REMOTE=${{ vars.NEXT_PUBLIC_EMOTICON_API_REMOTE }}
            NEXT_PUBLIC_UPLOAD_OPTIMIZATION=${{ vars.NEXT_PUBLIC_UPLOAD_OPTIMIZATION }}
            NEXT_PUBLIC_SHORTCUT_ICLOUD_URL=${{ vars.NEXT_PUBLIC_SHORTCUT_ICLOUD_URL }}
            BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          source: infra/docker-compose.yml,infra/Caddyfile
          target: /opt/jandh
          strip_components: 1

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          script: |
            set -euo pipefail
            # INFO: jandh-emoticons deploys to this host too, and its `docker image prune -f` GCs an in-flight pull's ingest out from under us
            exec 9>/tmp/jandh-deploy.lock
            flock -w 900 9
            cd /opt/jandh
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose pull

            sudo docker rm -f jandh-static >/dev/null 2>&1 || true
            sudo docker create --name jandh-static ghcr.io/ggumipooh/jandh:latest
            sudo mkdir -p /srv/www/jandh/_next/static
            sudo docker cp jandh-static:/app/.next/static/. /srv/www/jandh/_next/static/
            sudo docker rm jandh-static

            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f
