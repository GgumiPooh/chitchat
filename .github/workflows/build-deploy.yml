name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ggumipooh/jandh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_EMOTICONS_ORIGIN=${{ vars.NEXT_PUBLIC_EMOTICONS_ORIGIN }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SSE_IDLE_SLEEP=${{ vars.NEXT_PUBLIC_SSE_IDLE_SLEEP }}
            NEXT_PUBLIC_EMOTICON_API_REMOTE=${{ vars.NEXT_PUBLIC_EMOTICON_API_REMOTE }}
            BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          source: infra/docker-compose.yml
          target: /opt/jandh
          strip_components: 1

      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          source: infra/jandh.caddy
          target: /srv/caddy/sites
          strip_components: 1

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INFRA_MONO_HOST }}
          username: ${{ secrets.INFRA_MONO_USER }}
          key: ${{ secrets.INFRA_MONO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/jandh
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull

            docker rm -f jandh-static >/dev/null 2>&1 || true
            docker create --name jandh-static ghcr.io/ggumipooh/jandh:latest
            mkdir -p /srv/www/jandh/_next/static
            docker cp jandh-static:/app/.next/static/. /srv/www/jandh/_next/static/
            docker rm jandh-static

            docker compose up -d --remove-orphans
            docker exec everytldr-caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
