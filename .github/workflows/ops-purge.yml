name: Ops — purge deleted

# REQUIREMENTS.md § 9., § 12.4. Reclaims the bytes behind soft-deleted media and expired
# upload claims. jandh runs the same two passes off `POST /api/media/upload-url`; this is
# the half that does not wait for somebody to upload something.

on:
  schedule:
    # WARN: Ten minutes is what is asked for, not what is delivered. GitHub's scheduler runs
    # late under load and skips runs, so treat this as "several times an hour". The work is
    # idempotent and every pass resumes the last one, so a late run costs only latency.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Count what would be reclaimed without reclaiming it
        type: boolean
        default: false
      notify-email:
        description: Who to notify when this finishes. Left empty by a hand-started run from the Actions tab.
        type: string
        default: ""

permissions:
  contents: read

# WARN: Keyed by trigger, so a hand-started run and the schedule do not share a queue.
# GitHub keeps at most ONE pending run per group: with a single group, a dispatch that
# queued behind an in-flight pass was replaced — and silently cancelled — by the next
# ten-minute run, losing the only run that had `notify` on. The presser saw 요청했어요 and
# never got a banner.
#
# INFO: Overlapping a scheduled pass is safe, and this is the one job where that is true by
# construction: every stamp is guarded on `r2_purged_at IS NULL` and deleting a key R2 no
# longer holds succeeds, which is the same argument that lets jandh's own upload-triggered
# copy run beside it (§ 9.). Serializing within each trigger is hygiene, not correctness.
concurrency:
  group: ops-purge-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  purge:
    uses: ./.github/workflows/ops-job.yml
    with:
      script: ops:purge
      timeout-minutes: 20
      # INFO: A schedule never previews — `github.event_name` is not `workflow_dispatch`, so this is false there whatever the input says.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      # WARN: A hand-started run notifies; the schedule does not. Somebody pressed 지금 회수하기
      # and is waiting for an answer, where the ten-minute schedule fires whether or not there
      # was anything to do — and a banner per run is a hundred-odd pushes a day, on the channel
      # this app raises 메시지 on. `PURGE_NOTIFY=true` opts the schedule in anyway.
      notify: ${{ github.event_name == 'workflow_dispatch' || vars.PURGE_NOTIFY == 'true' }}
      # INFO: Set by 서버 관리 so the answer reaches whoever pressed the button; empty from the Actions tab, which falls back to the default account.
      notify-email: ${{ inputs.notify-email || '' }}
    secrets: inherit
